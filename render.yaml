services:
  - type: web
    name: healthrecords-music-sub-bot
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python music_bot.py
    envVars:
      - key: PORT
        value: 10000
      - key: USE_DISCORD_PROXY
        value: "true"
      - key: DISCORD_PROXY_URL
        value: https://discord-proxy.mugiandietquy.workers.dev/api/v10
